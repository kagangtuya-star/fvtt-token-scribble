<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TokenScribble replace harness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="styles/token-scribble.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2a28;
        color: #eee;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      .side {
        position: fixed;
        inset: 0 auto 0 0;
        width: 300px;
        padding: 10px;
        overflow: auto;
        box-sizing: border-box;
        background: #1e1d1b;
      }
      .side button {
        margin: 0 6px 8px 0;
      }
      .side figure {
        margin: 0 0 8px;
      }
      .side img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        background: repeating-conic-gradient(#ccc 0 25%, #eee 0 50%) 0 0 / 12px 12px;
      }
      .side figcaption,
      .side pre {
        font:
          10px/1.3 ui-monospace,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      /* Minimal look of a Foundry window frame, layered like Foundry v13's own CSS
         (core styles live in cascade layers, so unlayered module styles win). */
      @layer applications {
        .application {
          position: fixed;
          top: 20px;
          left: 320px;
          display: flex;
          flex-direction: column;
          max-width: calc(100vw - 330px);
          max-height: calc(100vh - 30px);
          border: 1px solid #000;
          border-radius: 6px;
          background: #23221f;
          color: #eee;
          box-shadow: 0 0 20px #000;
        }
        .application .window-header {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 6px 10px;
          border-bottom: 1px solid #000;
        }
        .application .window-title {
          flex: 1;
          margin: 0;
          font-size: 14px;
        }
        .application .window-content {
          flex: 1;
          min-height: 0;
          display: flex;
        }
        .application button {
          padding: 4px 10px;
          border: 1px solid #555;
          border-radius: 4px;
          background: #3a3936;
          color: inherit;
          cursor: pointer;
        }
      }
    </style>
  </head>
  <body>
    <aside class="side">
      <button type="button" id="h-token">Redraw token</button>
      <button type="button" id="h-portrait">Redraw portrait</button>
      <div id="h-preview"></div>
      <p>Files on the fake server:</p>
      <pre id="h-files"></pre>
      <p>Log:</p>
      <pre id="h-log"></pre>
    </aside>
    <script type="module" src="dev/replace-harness.js"></script>
  </body>
</html>
