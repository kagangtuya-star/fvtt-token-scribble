name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the module and attaches
# module.json + module.zip to that release. The manifest URLs are derived from
# this repository, so nothing has to be edited by hand.
#
#   manifest: https://github.com/<owner>/<repo>/releases/latest/download/module.json
#   download: https://github.com/<owner>/<repo>/releases/download/<tag>/module.zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run lint:i18n

      - name: Build
        run: npm run build

      - name: Package with release URLs
        env:
          MODULE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Fails if the tag does not match the version in module.json / package.json.
        run: node tools/package.mjs

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/module.json release/module.zip --clobber
