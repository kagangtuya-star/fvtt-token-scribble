name: Release

# Push a vX.Y.Z tag, publish a GitHub release, or run manually for an existing
# tag to build and attach module.json + module.zip. The manifest URLs are
# derived from this repository and the selected tag.
#
#   manifest: https://github.com/<owner>/<repo>/releases/latest/download/module.json
#   download: https://github.com/<owner>/<repo>/releases/download/<tag>/module.zip

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (must match module.json / package.json)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODULE_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run check

      - name: Package with release URLs
        # Fails if the tag does not match the version in module.json / package.json.
        run: node tools/package.mjs

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/module.json release/module.zip --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release/module.json release/module.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${options[@]}"
          fi
